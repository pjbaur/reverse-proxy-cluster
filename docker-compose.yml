name: reverse-proxy-cluster

services:
  reverse-proxy:
    build: ./reverse-proxy
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  java-backend:
    build: ./backends/java
    profiles: ["java"]
    restart: unless-stopped
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/messages"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

networks:
  proxy-net:
    driver: bridge
