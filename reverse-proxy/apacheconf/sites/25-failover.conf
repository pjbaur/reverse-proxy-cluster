# /failover/... -> balancer://failover (two active members + one shared hot
# standby, Compose profile "failover"). The actives (primary + secondary)
# share traffic round-robin while healthy; with one active down, the survivor
# serves everything; the standby (H) answers only while BOTH actives are in
# error state. Actives retry=5 keeps a bounded error window so the standby
# activates and the actives recover within 5 s (retry=0 on an active wipes
# the error state and breaks hot standby); standby retry=0 for instant
# activation.
<Proxy "balancer://failover">
    BalancerMember "http://node-backend-primary:8080" retry=5
    BalancerMember "http://node-backend-secondary:8080" retry=5
    BalancerMember "http://node-backend-standby:8080" retry=0 status=+H
    ProxySet lbmethod=byrequests
</Proxy>
ProxyPass        "/failover/" "balancer://failover/"
ProxyPassReverse "/failover/" "balancer://failover/"
