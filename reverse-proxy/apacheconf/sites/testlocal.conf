<VirtualHost *:80>
	
	ServerName test.local
	ServerAlias www.test.local

	ServerAdmin admin@techolaf.com
	DocumentRoot /usr/local/apache2/testlocal
	
	<Directory "/usr/local/apache2/testlocal">
		Order allow,deny
		AllowOverride All
		Allow from all
		Require all granted
	</Directory>

    #Load the SSL module that is needed to terminate SSL on Apache
    # LoadModule ssl_module modules/mod_ssl.so

    # This directive toggles the usage of the SSL/TLS Protocol Engine for proxy. Without this you
    # cannot use HTTPS URL as your Origin Server
    # SSLProxyEngine on

    # To prevent SSL Offloading
    # Set the X-Forwarded-Proto to be https for your Origin Server to understand that this request is
    # made over HTTPS #https://httpd.apache.org/docs/2.2/mod/mod_headers.html#requestheader.
    # RequestHeader set X-Forwarded-Proto “http”
    # RequestHeader set X-Forwarded-Port “8888”	

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined

    # The ProxyPass directive specifies the mapping of incoming requests to the backend server (or a 
    # cluster of servers known as a Balancer group).
    # It proxies the requests only with matching URI “/test”
    ProxyPass "/messages" "http://app-server:8888/messages"

    # To ensure that and Location: headers generated from the backend are modified to point to the
    # reverse proxy, instead of back to itself, #the ProxyPassReverse directive is most often required:
    ProxyPassReverse "/messages" "http://app-server:8888/messages"
	
</VirtualHost>